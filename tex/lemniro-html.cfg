\Preamble{xhtml}
% Balance the math-class pause across the complete image, not only its alt
% attribute. Older TeX4ht versions can otherwise lose math tokens after TikZ.
% Based on the TeX4ht maintainer's IMG fix (Michal Hoftich, CC BY-SA 4.0):
% https://tex.stackexchange.com/questions/764780/
\catcode`\:11
\Configure{IMG}
  {\PauseMathClass\ht:special{t4ht=\ifmathml <\a:mathml semantics><\a:mathml annotation-xml encoding="application/xhtml+xml">\fi<img src="\a:imgdir }}
  {\ht:special{t4ht=" alt="}}
  {" }
  {\ht:special{t4ht=" }}
  {\ht:special{t4ht=\xml:empty>\ifmathml </\a:mathml annotation-xml></\a:mathml semantics>\fi}\EndPauseMathClass}
\catcode`\:12
\begin{document}
\makeatletter
\@ifpackageloaded{tikz}{\HRestore\pgfsys@beginpicture\HRestore\pgfsys@endpicture}{}
\makeatother
% Keep the actual environment name, including user-defined \newtheorem types.
% Text and mathematical content continue through TeX4ht's normal conversion.
\Configure{newtheorem}
  {\ifvmode\IgnorePar\fi\EndP
   \HCode{<div class="newtheorem" data-environment="\csname @currenvir\endcsname">}%
   \par\noindent\HCode{<span class="head">}}
  {\HCode{</span>}}
  {\ifvmode\IgnorePar\fi\EndP\HCode{</div>}\par\indent\ShowPar}
\EndPreamble
