% TeX4ht adapter: emit semantic HTML plus real TeX visual fragments.
% PicMath measures the logical box; the one internal hook records its origin.
% Keep this protocol under integration tests when upgrading TeX Live.
\Preamble{xhtml}
\begin{document}
\makeatletter
\edef\LemniroBaseSize{\f@size}
% Mathematics is already captured as a complete TeX picture. Older TeX4ht
% mathpalette wrappers create nested pictures and change zero-width overlays.
\HRestore\mathpalette
\Configure{PicMath}
{\setbox0=}
{\HCode{<span class="tex-inline-metric" data-width="\the\wd0" data-height="\the\ht0" data-depth="\the\dp0" data-em="\f@size" data-base-em="\LemniroBaseSize">}\box0\HCode{</span>}}
{}
{class="math"}
\catcode`\:11
\append:def\pic:math{\special{dvisvgm:raw <g data-tex-origin-x='{?x}' data-tex-origin-y='{?y}'/>}}
\Configure{PictureAttr*+}{\ht:special{t4ht=#1 data-tex-font="\f@size" data-tex-base-font="\LemniroBaseSize"}}
\Configure{PictureAttr*+[]}{\ht:special{t4ht=#1 data-tex-font="\f@size" data-tex-base-font="\LemniroBaseSize"}}
\catcode`\:12
\newcommand\LemniroSvgEnvironment[1]{%
  \ConfigureEnv{#1}
    {\ifvmode\IgnorePar\fi\EndP\HCode{<div class="tex-math-block" data-tex-environment="#1">}\Picture*{ class="tex-block-svg"}}
    {\EndPicture\EndP\HCode{</div>}\par\ShowPar}
    {}{}%
}
\LemniroSvgEnvironment{align}
\LemniroSvgEnvironment{align*}
\LemniroSvgEnvironment{gather}
\LemniroSvgEnvironment{gather*}
\LemniroSvgEnvironment{multline}
\LemniroSvgEnvironment{multline*}
\@ifpackageloaded{tikz}{\HRestore\pgfsys@beginpicture\HRestore\pgfsys@endpicture}{}
\makeatother
% Preserve semantic environments independently of their visual stylesheet.
\Configure{newtheorem}
  {\ifvmode\IgnorePar\fi\EndP
   \HCode{<div class="newtheorem" data-environment="\csname @currenvir\endcsname">}%
   \par\noindent\HCode{<span class="head">}}
  {\HCode{</span>}}
  {\ifvmode\IgnorePar\fi\EndP\HCode{</div>}\par\indent\ShowPar}
\EndPreamble
